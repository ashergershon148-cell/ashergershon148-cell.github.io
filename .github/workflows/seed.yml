# re-run seed
name: Seed site from live source
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and place app
        env:
          BASE: https://gps-risks-murphy-tournament.trycloudflare.com
        run: |
          set -euo pipefail
          mkdir -p thailand-trip-app
          for f in index.html styles.css data.js app.js README.md; do
            echo "GET $f"
            curl -fsSL "$BASE/$f" -o "thailand-trip-app/$f"
            wc -c "thailand-trip-app/$f"
          done
          test "$(wc -c < thailand-trip-app/data.js)" -gt 30000
          test "$(wc -c < thailand-trip-app/app.js)" -gt 40000
          touch .nojekyll thailand-trip-app/.nojekyll
          cat > index.html << 'HTML'
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=./thailand-trip-app/" />
  <title>תאילנד שלי</title>
  <link rel="canonical" href="./thailand-trip-app/" />
</head>
<body>
  <p><a href="./thailand-trip-app/">פתחו את אפליקציית תאילנד שלי</a></p>
</body>
</html>
HTML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo nothing; else git commit -m "Publish Thailand trip app to /thailand-trip-app/"; git push; fi
