name: Seed site from live source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed.yml'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and place app
        env:
          BASE: https://gps-risks-murphy-tournament.trycloudflare.com
        run: |
          set -euo pipefail
          mkdir -p thailand-trip-app
          for f in index.html styles.css data.js app.js README.md; do
            curl -fsSL "$BASE/$f" -o "thailand-trip-app/$f"
            wc -c "thailand-trip-app/$f"
          done
          test "$(wc -c < thailand-trip-app/data.js)" -gt 30000
          test "$(wc -c < thailand-trip-app/app.js)" -gt 40000
          touch .nojekyll thailand-trip-app/.nojekyll
          cat > index.html << 'HTML'
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=./thailand-trip-app/" />
  <title>תאילנד שלי</title>
  <link rel="canonical" href="./thailand-trip-app/" />
</head>
<body>
  <p><a href="./thailand-trip-app/">פתחו את אפליקציית תאילנד שלי</a></p>
</body>
</html>
HTML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo nothing; else git commit -m "Publish Thailand trip app to /thailand-trip-app/"; git push; fi
      - name: Try enable Pages from main /
        run: |
          set +e
          AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          H=(-H "$AUTH" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          API="https://api.github.com/repos/${{ github.repository }}/pages"
          BODY='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          curl -sS -o /tmp/p -w "POST:%{http_code}\n" -X POST "${H[@]}" "$API" -d "$BODY"; cat /tmp/p; echo
          curl -sS -o /tmp/u -w "PUT:%{http_code}\n" -X PUT "${H[@]}" "$API" -d "$BODY"; cat /tmp/u; echo
          curl -sS "${H[@]}" "$API" || true; echo
